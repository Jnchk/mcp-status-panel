[package]
name = "status-panel"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
eframe = "0.37.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wgpu = { version = "30", default-features = false, features = ["counters"] }

[profile.release]
lto = true
strip = true

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[build-dependencies]
ico = "0.6.0"
winresource = "0.1.34"
